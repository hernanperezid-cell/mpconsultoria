<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPCONSULTORIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1120;--side:#0f1729;--surf:#141d33;--surf2:#1a2540;--line:#26324f;
  --tx:#e9edf7;--mut:#8f9bb8;--acc:#f5b83d;--acc-tx:#1c1400;--ok:#3ecf9e;--bad:#ff6b6b;
  --f-d:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-b:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f-b);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:272px 1fr;min-height:100%}

/* Menú lateral */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 16px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--acc);color:var(--acc-tx);display:grid;place-items:center;font-family:var(--f-d);font-weight:700;font-size:15px}
.brand-name{font-family:var(--f-d);font-weight:700;font-size:17px;letter-spacing:.2px}
.brand-sub{font-size:12px;color:var(--mut)}
.switch{position:relative;margin-bottom:14px}
.switch-btn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px}
.switch-btn:hover{border-color:var(--acc)}
.switch-txt{flex:1;min-width:0}
.switch-lbl{font-size:12px;color:var(--mut)}
.switch-nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.45);max-height:320px;overflow:auto}
.menu[hidden]{display:none}
.menu button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:8px;text-align:left}
.menu button:hover,.menu button.on{background:var(--surf)}
.menu .sep{height:1px;background:var(--line);margin:6px 0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mut);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surf);color:var(--tx)}
.nav a.on{background:var(--surf2);color:var(--tx);box-shadow:inset 3px 0 0 var(--acc)}
.nav svg{width:19px;height:19px;flex:none}
.nav .tag{margin-left:auto;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:0 7px}
.side-foot{margin-top:auto;padding:14px 6px 0;font-size:12px;color:var(--mut)}

/* Avatares */
.av{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-family:var(--f-d);font-weight:700;color:#fff;overflow:hidden;background:#34406a}
.av img{width:100%;height:100%;object-fit:cover;background:#fff}
.av.lg{width:64px;height:64px;border-radius:14px;font-size:24px}
.av.sm{width:30px;height:30px;border-radius:8px;font-size:13px}

/* Contenido */
.main{padding:28px 34px 60px;min-width:0;max-width:1180px}
.topbar{display:none}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.tabs button.on{background:var(--acc);color:var(--acc-tx);border-color:var(--acc);font-weight:700}
.kan{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:120px}
.kcol h3{font-family:var(--f-d);font-size:15px;margin:2px 4px 10px;display:flex;justify-content:space-between}
.kc{background:var(--surf2);border-radius:10px;padding:10px;margin-bottom:8px}
.kc b{display:block;font-size:14px;margin-bottom:6px}
.kc .acts{margin-top:6px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.bars{display:flex;align-items:flex-end;gap:14px;height:130px;padding:10px 4px 0}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mut)}
.bars i{display:block;width:100%;max-width:60px;background:var(--acc);border-radius:6px 6px 0 0;min-height:3px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl th{color:var(--mut);font-weight:500}
@media (max-width:900px){.kpi{grid-template-columns:1fr 1fr}}
.ed{display:grid;grid-template-columns:350px 1fr;gap:18px;align-items:start}
.ed canvas{width:100%;max-height:70vh;object-fit:contain;border-radius:12px;background:#000;display:block}
.ed .f{margin-bottom:10px}
.ed input[type=range]{width:100%;padding:0}
@media (max-width:900px){.ed{grid-template-columns:1fr}}
@media print{:root{--bg:#fff;--side:#fff;--surf:#fff;--surf2:#f2f2f2;--line:#ccc;--tx:#111;--mut:#555}.side,.topbar,.tools,.scrim,.toast{display:none!important}.app{display:block}.main{padding:0}}
.pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;margin:4px 0 10px}
.vb{display:block!important}
.vb h3{font-family:var(--f-d);margin:14px 0 4px;font-size:16px}
.vb audio{width:100%;margin:4px 0 8px}
.scrim{display:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-family:var(--f-d);font-size:30px;line-height:1.15;margin:0 0 4px}
h2{font-family:var(--f-d);font-size:19px;margin:0 0 12px}
.sub{color:var(--mut);margin:0}
.btn{border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-tx);font-weight:700}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.del:hover{border-color:var(--bad);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:26px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font-family:var(--f-d);font-size:28px;line-height:1.1}
.stat span{color:var(--mut);font-size:13px}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin-bottom:26px}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0}
.row-t{font-weight:700}
.row-s{color:var(--mut);font-size:13px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px;max-width:260px}
.bar i{display:block;height:100%;background:var(--ok)}
.badge{font-size:12px;border-radius:20px;padding:2px 9px;background:rgba(245,184,61,.15);color:var(--acc);font-weight:700;white-space:nowrap}
.badge.ok{background:rgba(62,207,158,.15);color:var(--ok)}
.badge.mut{background:var(--surf2);color:var(--mut);font-weight:500}

/* Empresas */
.tools{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.tools input{flex:1;min-width:200px}
input[type=text],input[type=search],input[type=password],input[type=date],input[type=time],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{resize:vertical;min-height:64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.act{border-color:var(--acc)}
.card-h{display:flex;gap:12px;align-items:center}
.card-h .row-main{min-width:0}
.card-h .row-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;background:var(--surf2);border-radius:20px;padding:2px 9px;color:var(--mut)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.empty{text-align:center;padding:44px 20px;color:var(--mut);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:6px}

/* Formulario */
dialog{background:var(--surf);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(3,6,14,.7)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surf);z-index:2}
.dlg-h h2{margin:0}
.x{background:none;border:0;font-size:22px;color:var(--mut);line-height:1}
.dlg-b{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:5px}
.f.w{grid-column:1/-1}
.f label{font-size:13px;color:var(--mut)}
.f small{color:var(--mut);font-size:12px}
.logo-row{display:flex;gap:14px;align-items:center}
.dlg-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surf)}
input[type=color]{width:56px;height:38px;padding:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.hint{background:var(--surf2);border-radius:12px;padding:14px 16px;color:var(--mut);margin-top:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--surf2);border:1px solid var(--line);padding:10px 18px;border-radius:12px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast[hidden]{display:none}

.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px}
.lock[hidden]{display:none}
.lock-box{width:min(400px,100%);background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:30px 26px;text-align:center}
.lock-box .brand-mark{margin:0 auto 14px;width:46px;height:46px;font-size:18px}
.lock-box h1{font-size:23px}
.lock-box form{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.lock-box input{text-align:center}
.lock-box .lnk{background:none;border:0;color:var(--mut);text-decoration:underline;margin-top:14px;font-size:13px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:2px 0 0}
.pw{display:flex;flex-direction:column;gap:12px;max-width:380px;padding:10px 0 14px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:284px;z-index:30;transform:translateX(-100%);transition:transform .2s}
  body.open .side{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(3,6,14,.6);z-index:25}
  body.open .scrim{display:block}
  .topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--side);position:sticky;top:0;z-index:10}
  .topbar .ham{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
  .main{padding:20px 16px 60px}
  .stats{grid-template-columns:1fr}
  .dlg-b{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="brand-mark">MP</div>
      <div><div class="brand-name">MPCONSULTORIA</div><div class="brand-sub">Todo en un solo lugar</div></div>
    </div>
    <div class="switch" id="switch"></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><button type="button" class="btn sm" data-act="bloquear">Bloquear</button><div style="margin-top:10px">Los datos se guardan en este navegador.</div></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div>
    <div class="topbar"><button class="ham" id="ham" aria-label="Abrir menú">Menú</button><b>MPCONSULTORIA</b></div>
    <main class="main" id="main"></main>
  </div>
</div>

<dialog id="dlg">
  <form id="frm" method="dialog">
    <div class="dlg-h"><h2 id="dlgTitle">Nueva empresa</h2><button type="button" class="x" data-act="cerrar" aria-label="Cerrar">&times;</button></div>
    <div class="dlg-b" id="dlgBody"></div>
    <div class="dlg-f">
      <button type="button" class="btn" data-act="cerrar">Cancelar</button>
      <button type="submit" class="btn pri">Guardar empresa</button>
    </div>
  </form>
</dialog>
<dialog id="dlg2"><div class="dlg-h"><h2 id="d2t"></h2><button type="button" class="x" data-act="cerrar2" aria-label="Cerrar">&times;</button></div><div class="dlg-b vb" id="d2b"></div></dialog>
<div class="toast" id="toast" hidden></div>
<div class="lock" id="lock" hidden></div>

<script>
(function(){
'use strict';
var KEY='mpconsultoria_v1';
var TIPOS=['Cafetería','Restaurante','Comercio local','Artesanal','Tienda de ropa','Belleza y estética','Salud y bienestar','Servicios profesionales','Educación','Streaming y tecnología','Otro'];
var TONOS=['Cercano','Profesional','Divertido','Elegante','Familiar'];
var IC={
  inicio:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  empresas:'M4 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16M14 9h5a1 1 0 0 1 1 1v11M8 8h2M8 12h2M8 16h2M3 21h18',
  diagnostico:'M4 20V10M10 20V4M16 20v-8M22 20H2',
  planificador:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
  guiones:'M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM6 11a6 6 0 0 0 12 0M12 17v4',
  diseno:'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9h.01',
  estadisticas:'M3 3v18h18M7 14l3-3 3 3 5-6',
  comparativo:'M12 4v16M5 20h14M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z',
  ajustes:'M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4'
};
var MODS=[
  {id:'inicio',n:'Inicio'},
  {id:'empresas',n:'Empresas'},
  {id:'diagnostico',n:'Diagnóstico y estrategia',d:'Benchmark contra el sector, recomendaciones, estrategias por plataforma e informes para el cliente.',o:'HMPI Pro',u:'las redes, el tipo de negocio y las cifras de la ficha'},
  {id:'planificador',n:'Planificador',d:'Calendario de publicaciones, ideas con IA y estadísticas por mes.',o:'Nadine',u:'el nombre, el logo y las redes de la ficha'},
  {id:'estadisticas',n:'Estadísticas'},
  {id:'guiones',n:'Guiones y voz',d:'Reels, videos largos, cuñas de radio y jingles.',o:'CreadorMP',u:'los productos, el público y el tono de la ficha'},
  {id:'diseno',n:'Estudio de diseño',d:'Carruseles, historias y posts con descarga en ZIP.',o:'Estudio de Campañas',u:'el logo, el color, los productos y el tono de la ficha'},
  {id:'comparativo',n:'Comparativo',d:'Una sola tabla con los resultados de todas las empresas.',o:'Nadine y HMPI Pro',u:'todas las empresas registradas'},
  {id:'ajustes',n:'Ajustes',d:'Clave de acceso, respaldo, importación de datos viejos y sincronización entre equipos.',o:'Todas las apps',u:'todos los datos de la plataforma'}
];

function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(s,r){return (r||document).querySelector(s)}

function seed(){
  var d=[['Melao Sabor y Café','Cafetería','#c98a4b'],['La Dorada Tolimense','Restaurante','#d9482b'],['Dondecheche','Comercio local','#3f8f5a'],['Camilart','Artesanal','#3b82c4']];
  var em=d.map(function(x){return blank({nombre:x[0],tipo:x[1],ciudad:'Caldas',color:x[2]})});
  return {empresas:em,activa:em[0].id};
}
function blank(o){
  var e={id:uid(),nombre:'',tipo:'Otro',ciudad:'',logo:'',color:'#f5b83d',productos:'',diferenciales:'',publico:'',tono:'Cercano',objetivo:'Vender más',facebook:'',instagram:'',tiktok:'',whatsapp:'',notas:'',creada:Date.now()};
  for(var k in o){e[k]=o[k]}
  return e;
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.empresas))return d}}catch(e){}
  return seed();
}
var S=load();
var listeners=[];
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar. Revisa que el navegador permita almacenamiento y tenga espacio.')}
  listeners.forEach(function(f){try{f(S)}catch(e){}});
}
function activa(){return S.empresas.find(function(e){return e.id===S.activa})||null}
function setActiva(id){S.activa=id;save();renderAll()}

var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2800)}

/* Completitud de la ficha */
function pct(e){
  var c=[e.nombre,e.tipo&&e.tipo!=='Otro',e.ciudad,e.logo,e.productos,e.diferenciales,e.publico,(e.facebook||e.instagram||e.tiktok)];
  return Math.round(c.filter(Boolean).length/c.length*100);
}
function av(e,cls){
  if(!e)return '<div class="av '+(cls||'')+'">?</div>';
  if(e.logo)return '<div class="av '+(cls||'')+'"><img src="'+e.logo+'" alt=""></div>';
  return '<div class="av '+(cls||'')+'" style="background:'+esc(e.color)+'">'+esc((e.nombre||'?').trim().charAt(0).toUpperCase())+'</div>';
}
function svg(id){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="'+IC[id]+'"/></svg>'}

/* Menú lateral */
function renderSide(){
  var a=activa();
  var items=S.empresas.map(function(e){
    return '<button type="button" data-act="usar" data-id="'+e.id+'" class="'+(a&&a.id===e.id?'on':'')+'">'+av(e,'sm')+'<span>'+esc(e.nombre)+'</span></button>';
  }).join('');
  $('#switch').innerHTML=
    '<button type="button" class="switch-btn" id="swBtn" aria-haspopup="true">'+av(a)+
    '<span class="switch-txt"><span class="switch-lbl">Empresa activa</span><div class="switch-nm">'+(a?esc(a.nombre):'Sin empresa')+'</div></span><span aria-hidden="true">&#9662;</span></button>'+
    '<div class="menu" id="swMenu" hidden>'+items+(items?'<div class="sep"></div>':'')+'<button type="button" data-act="nueva"><span class="av sm" style="background:var(--acc);color:var(--acc-tx)">+</span><span>Nueva empresa</span></button></div>';
  var cur=route();
  $('#nav').innerHTML=MODS.map(function(m){
    return '<a href="#'+m.id+'" class="'+(cur===m.id?'on':'')+'">'+svg(m.id)+'<span>'+m.n+'</span>'+(m.d&&m.id!=='ajustes'&&m.id!=='guiones'&&m.id!=='planificador'&&m.id!=='diagnostico'&&m.id!=='comparativo'&&m.id!=='diseno'?'<span class="tag">Etapa 2</span>':'')+'</a>';
  }).join('');
}

/* Vistas */
function route(){var h=(location.hash||'#inicio').slice(1);return MODS.some(function(m){return m.id===h})?h:'inicio'}

function vInicio(){
  var n=S.empresas.length,full=S.empresas.filter(function(e){return pct(e)===100}).length,a=activa();
  var rows=S.empresas.map(function(e){
    var p=pct(e),isA=a&&a.id===e.id;

function onLogo(ev){
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var im=new Image();
    im.onload=function(){
      var M=256,r=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      logoTmp=c.toDataURL('image/png');prevLogo();
    };
    im.onerror=function(){toast('No se pudo leer esa imagen. Prueba con PNG o JPG.')};
    im.src=rd.result;
  };
  rd.readAsDataURL(f);
}

}

  else if(act==='gtab'){GV.tab=id;renderMain()}

function getAuth(){try{return JSON.parse(localStorage.getItem(AKEY))}catch(e){return null}}
function cyrb(str){
  var h1=0xdeadbeef,h2=0x41c6ce57,i,ch;
  for(i=0;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);

function rnd(){

}

  var txt=salt+'|'+pw,hasSub=!!(window.crypto&&crypto.subtle&&window.TextEncoder);

    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)).then(function(b){
      return 'sha:'+Array.from(new Uint8Array(b)).map(function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
    });

  hashPw(p1,a.salt,a.hash.slice(0,3)).then(function(h){
    if(h===a.hash){fails=0;unlock()}

var DBP=null;
function db(){
  if(!DBP)DBP=new Promise(function(res,rej){
    if(!window.indexedDB)return rej(new Error('sin-idb'));
    var r=indexedDB.open('mpconsultoria',1);

  });

}
function kvSet(k,v){return db().then(function(d){return new Promise(function(res,rej){var t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=function(){res()};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})})}

  var m=a.length,n=b.length,i,j,p=[],c;
  for(j=0;j<=n;j++)p[j]=j;
  for(i=1;i<=m;i++){var prev=p[0];p[0]=i;for(j=1;j<=n;j++){c=p[j];p[j]=Math.min(p[j]+1,p[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=c}}

      chain=chain.then(function(){
        if(it.err){inf.push(it.f.name+': '+it.err);return}
        if(!it.tipo){inf.push(it.f.name+': no reconozco este archivo. Usa los respaldos de CreadorMP, Nadine, Estudio de Campañas o HMPI Pro.');return}
        if(it.tipo==='mp'){inf.push(it.f.name+': es un respaldo de MPCONSULTORIA. Usa "Restaurar respaldo".');return}
        return importarUno(it).then(function(m){inf.push(m)},function(){inf.push(it.f.name+': no se pudo guardar en este navegador (almacenamiento bloqueado o lleno).')});
      });
    });
    return chain.then(function(){S.informe=inf;save();importando=false;renderAll();toast('Importación terminada')});
  }).catch(function(){importando=false;toast('No se pudo completar la importación.')});
}

/* Respaldo único (empresas + datos importados) */
var BKEY='mpconsultoria_ultimo_respaldo';
function ultimoResp(){try{var t=localStorage.getItem(BKEY);return t?new Date(t):null}catch(e){return null}}
function fmtFecha(d){return d.toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'})+', '+d.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'})}
function exportar(){
  var now=new Date(),falloIdb=false;
  kvAll().catch(function(){falloIdb=true;return {}}).then(function(all){
    var legacy={};
    Object.keys(all).forEach(function(k){if(k.indexOf('legacy:')===0)legacy[k.slice(7)]=all[k]});
    var data={app:'MPCONSULTORIA',version:2,fecha:now.toISOString(),datos:{empresas:S.empresas,activa:S.activa,imports:S.imports||{},legacy:legacy}};
    var blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    var url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='mpconsultoria-respaldo-'+now.toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1500);
    try{localStorage.setItem(BKEY,now.toISOString())}catch(e){}
    toast(falloIdb&&S.imports&&Object.keys(S.imports).length?'Respaldo descargado, pero sin los datos importados (el navegador no los dejó leer).':'Respaldo descargado');
    renderMain();
  });
}
function limpiarEmpresa(x){
  var o={};
  for(var k in x){if(typeof x[k]==='string')o[k]=x[k]}
  if(typeof x.creada==='number')o.creada=x.creada;
  if(o.logo&&o.logo.indexOf('data:image/')!==0)o.logo='';
  if(!/^#[0-9a-f]{6}$/i.test(o.color||''))delete o.color;
  return blank(o);
}
function restaurar(file){
  var rd=new FileReader();
  rd.onerror=function(){toast('No se pudo leer el archivo.')};
  rd.onload=function(){
    var d;
    try{d=JSON.parse(rd.result)}catch(e){return toast('El archivo no es un respaldo válido.')}
    if(!d||d.app!=='MPCONSULTORIA'||!d.datos||!Array.isArray(d.datos.empresas))return toast('Ese archivo no es un respaldo de MPCONSULTORIA.');
    var seen={},em=[];
    d.datos.empresas.forEach(function(x){
      if(!x||typeof x!=='object'||typeof x.nombre!=='string'||!x.nombre.trim())return;
      var e=limpiarEmpresa(x);
      while(seen[e.id])e.id=uid();
      seen[e.id]=1;em.push(e);
    });
    var lg=d.datos.legacy&&typeof d.datos.legacy==='object'?d.datos.legacy:null;
    var f=d.fecha?new Date(d.fecha):null,ft=f&&!isNaN(f)?' del '+fmtFecha(f):'';
    if(!confirm('Se reemplazarán las '+S.empresas.length+' empresas actuales por las '+em.length+' del respaldo'+ft+(lg?', junto con los datos importados de las apps anteriores':'')+'. ¿Continuar?'))return;
    S.empresas=em;
    S.activa=seen[d.datos.activa]?d.datos.activa:(em.length?em[0].id:null);
    var p=Promise.resolve();
    if(lg){
      S.imports=d.datos.imports&&typeof d.datos.imports==='object'?d.datos.imports:{};
      p=kvDelPrefix('legacy:').then(function(){return Promise.all(Object.keys(lg).map(function(k){return kvSet('legacy:'+k,lg[k])}))});
    }
    p.then(function(){save();renderAll();toast('Respaldo restaurado: '+em.length+' empresas')},
           function(){save();renderAll();toast('Se restauraron las empresas, pero no se pudieron guardar los datos importados.')});
  };
  rd.readAsText(file);
}
document.addEventListener('change',function(ev){
  var id=ev.target.id,fs=ev.target.files;
  if(ev.target.getAttribute&&ev.target.getAttribute('data-dt')){var tid=ev.target.getAttribute('data-dt'),vv=ev.target.value;guardarDiag(function(o){o.tareas.forEach(function(t){if(String(t.id)===tid)t.estado=vv})});return}
  if(ev.target.getAttribute&&ev.target.getAttribute('data-pest')){S.estPub=S.estPub||{};S.estPub[ev.target.getAttribute('data-pest')]=ev.target.value;save();pintarPL();return}
  if(id==='rf'){var f=fs&&fs[0];ev.target.value='';if(f)restaurar(f)}
  else if(id==='imf'){var l=fs?Array.prototype.slice.call(fs):[];ev.target.value='';if(l.length)importarArchivos(l)}
});

function boot(){
  var a=getAuth(),ok=false;
  try{ok=sessionStorage.getItem(SKEY)==='1'}catch(e){}
  if(a&&ok)unlock();else showLock(a?'login':'setup');
}

/* API compartida para los módulos de la etapa 2 */
window.MP={
  empresas:function(){return unlocked?S.empresas:[]},
  activa:function(){return unlocked?activa():null},
  setActiva:setActiva,
  legacy:function(f){return unlocked?kvGet('legacy:'+f).then(function(r){return r?r.datos:null}):Promise.resolve(null)},
  vinculos:function(f){return unlocked?kvGet('legacy:'+f).then(function(r){return r?r.vinculos:null}):Promise.resolve(null)},
  onChange:function(f){listeners.push(f)}
};

boot();
})();
</script>
